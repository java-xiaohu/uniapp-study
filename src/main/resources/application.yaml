spring:
  application:
    name: AI-llm
    version: 1.0.0
    description: AI Language Model
  # MySQL 数据源：库名/账号/密码可用环境变量覆盖，默认为 ai / root / 空密码
  datasource:
    url: "jdbc:mysql://localhost:3306/${MYSQL_DB:ai}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 启动阶段不校验连接，MySQL 未就绪时不阻塞应用；首次执行 SQL 时才真正建连
      initialization-fail-timeout: -1
      connection-timeout: 5000
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 本机 Redis 已开启密码认证（redis.windows.conf 的 requirepass），生产环境用 REDIS_PASSWORD 环境变量覆盖
      password: "${REDIS_PASSWORD:Haobai@114}"
      database: 0
      timeout: 5s
      connect-timeout: 3s
  ai:
    model:
      # 关闭 Spring AI 自动装配，模型统一由 ChatModelFactory 按 ai.models 动态构建
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
server:
  port: 8080
  # Accept-Language 的 locale 上限由 TomcatConfig 设置（Tomcat 11 默认 10 个，浏览器常带 14+ 个）

# JWT 认证配置：生产环境务必通过 JWT_SECRET 环境变量覆盖默认密钥（HS256 要求至少 32 字节）
jwt:
  secret: ${JWT_SECRET:ai-llm-dev-jwt-secret-key-0123456789abcdef}
  access-ttl: 30m
  refresh-ttl: 7d

# MyBatis-Plus 配置
mybatis-plus:
  # 自定义 SQL 的 XML 映射文件位置
  mapper-locations: classpath*:mapper/**/*.xml
  # 实体类别名包，XML 中可直接用类名
  type-aliases-package: com.hzy.aillm.entity
  configuration:
    # 下划线列名 -> 驼峰属性名自动映射
    map-underscore-to-camel-case: true
    # 控制台打印 SQL，便于本地排查，生产环境可改为 org.apache.ibatis.logging.slf4j.Slf4jImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    # 关闭启动 banner
    banner: false
    db-config:
      # 主键策略：数据库自增
      id-type: auto
      # 逻辑删除字段及取值（实体字段加 @TableLogic 或同名 deleted 字段即生效）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 多模型统一配置：key 即对外暴露的模型标识
ai:
  default-model: qwen-plus
  max-history-messages: 20
  models:
    # 通义千问（OpenAI 兼容模式）
    qwen-plus:
      provider: openai
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY:sk-ws-H.YYYLXLE.mpxC.MEUCIDSXOt5Xvt59M634Ns0jcQzMu099o4JPOEgIFH6RwgXXAiEA6JqN-_V0mVnkywLLCWGbqmlgXqlFhSQo-mWDl-Cky9A}
      model: qwen-plus
      temperature: 0.7
      max-tokens: 2048
      fallback: [deepseek-chat, local-qwen]

    # DeepSeek（OpenAI 兼容模式）
    deepseek-chat:
      provider: openai
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:}
      model: deepseek-chat
      temperature: 0.7
      max-tokens: 2048
      fallback: [local-qwen]

    # Anthropic Claude
    claude:
      provider: anthropic
      base-url: https://api.anthropic.com
      api-key: ${ANTHROPIC_API_KEY:}
      model: claude-sonnet-4-6
      temperature: 0.7
      max-tokens: 4096
      fallback: [qwen-plus]

    # 本地 Ollama（无需 api-key）
    local-qwen:
      provider: ollama
      base-url: http://localhost:11434
      model: qwen3:8b
      temperature: 0.6
      max-tokens: 1024
      timeout: 120s